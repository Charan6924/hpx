# Installs the dependencies listed in .github/vcpkg/vcpkg.json with vcpkg at
# the manifest's baseline. vcpkg is set up in C:/projects/vcpkg and the
# packages are installed into C:/projects/vcpkg/installed, so that a project
# configured with
#   -DCMAKE_TOOLCHAIN_FILE='C:/projects/vcpkg/scripts/buildsystems/vcpkg.cmake'
# and without a vcpkg.json of its own finds them (classic mode). The built
# packages are kept in the GitHub Actions cache, so only the first run after a
# change of the manifest builds them.

name: 'Set up vcpkg'
description: 'Install the Windows CI dependencies with vcpkg, cached'

inputs:
  triplet:
    description: 'vcpkg triplet to install'
    required: false
    default: 'x64-windows'

runs:
  using: "composite"
  steps:
    - name: Set the vcpkg binary cache directory
      shell: pwsh
      run: |
        $cache = "${{ runner.temp }}\vcpkg-binary-cache"
        New-Item -ItemType Directory -Force $cache | Out-Null
        "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> $env:GITHUB_ENV

    - name: Restore the vcpkg binary cache
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}\vcpkg-binary-cache
        key: vcpkg-${{ inputs.triplet }}-${{ hashFiles('.github/vcpkg/vcpkg.json') }}
        restore-keys: vcpkg-${{ inputs.triplet }}-

    - name: Check out and bootstrap vcpkg
      shell: pwsh
      run: |
        $baseline = (Get-Content .github/vcpkg/vcpkg.json | ConvertFrom-Json).'builtin-baseline'
        git init -q C:\projects\vcpkg
        git -C C:\projects\vcpkg fetch -q --depth 1 https://github.com/microsoft/vcpkg.git $baseline
        git -C C:\projects\vcpkg checkout -q FETCH_HEAD
        C:\projects\vcpkg\bootstrap-vcpkg.bat -disableMetrics

    - name: Install the dependencies
      shell: pwsh
      run: |
        C:\projects\vcpkg\vcpkg.exe install `
          --x-manifest-root=.github/vcpkg `
          --x-install-root=C:\projects\vcpkg\installed `
          --triplet ${{ inputs.triplet }}
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Save the vcpkg binary cache
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}\vcpkg-binary-cache
        key: vcpkg-${{ inputs.triplet }}-${{ hashFiles('.github/vcpkg/vcpkg.json') }}
